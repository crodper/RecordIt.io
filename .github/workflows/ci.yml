name: CI/CD

# - test:    corre la suite en cada push a master y en cada PR.
# - build:   en cada tag (v*), construye el AppImage (Linux), el .exe (Windows)
#            y el .app (macOS arm64).
# - release: en cada tag, crea la Release de GitHub enlazando ambos binarios,
#            con notas de cambios de esa versión autogeneradas desde los commits.
#
# Lanzar una release:  git tag v1.0.0 && git push origin v1.0.0
#
# El binario NO empaqueta el modelo Whisper (~3 GB): se descarga en la 1ª
# transcripción.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Dependencias del sistema
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Tests
        run: pytest -q

  # --------------------------------------------------------------------------
  # AppImage portable. Se construye dentro de python:3.12-bullseye (glibc 2.31)
  # para que el binario funcione también en equipos con glibc antigua.
  build-appimage:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    container: python:3.12-bullseye
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias del sistema
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libportaudio2 tk file desktop-file-utils curl xz-utils ca-certificates
      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: ffmpeg estático
        run: |
          mkdir -p vendor
          curl -fsSL -o /tmp/ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar xf /tmp/ffmpeg.tar.xz -C /tmp
          cp /tmp/ffmpeg-*-static/ffmpeg vendor/ffmpeg
          chmod +x vendor/ffmpeg
      - name: Binario portable (PyInstaller)
        run: pyinstaller --noconfirm --clean --distpath dist-portable --workpath /tmp/wb recordit.spec
      - name: Empaquetar AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: bash make-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: recordIt-x86_64.AppImage
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # .exe en un runner Windows. Instala el VC++ runtime (lo necesita ctranslate2)
  # y ffmpeg.exe, y compila con PyInstaller.
  build-exe:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: VC++ runtime (x64)
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "$env:TEMP\vc_redist.x64.exe"
          Start-Process -Wait -FilePath "$env:TEMP\vc_redist.x64.exe" -ArgumentList "/install","/quiet","/norestart"
      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Comprobar dependencias
        run: python -c "import tkinter, customtkinter, PIL, sounddevice, ctranslate2; print('deps OK')"
      - name: ffmpeg.exe estático
        run: |
          New-Item -ItemType Directory -Force vendor | Out-Null
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "$env:TEMP\ffmpeg.zip"
          Expand-Archive -Force "$env:TEMP\ffmpeg.zip" "$env:TEMP\ffmpeg"
          Copy-Item (Get-ChildItem "$env:TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName "vendor\ffmpeg.exe"
      - name: Compilar (PyInstaller)
        run: python -m PyInstaller --noconfirm --clean recordit.spec
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/recordIt.exe
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # .app en un runner macOS. Solo Apple Silicon: el wheel de onnxruntime (la VAD
  # de Whisper) ya no se publica para macOS x86_64.
  # continue-on-error mientras el build no se haya visto pasar en un Mac real:
  # así un fallo aquí no impide publicar el AppImage y el .exe. Quitarlo cuando
  # haya una ejecución verde.
  build-app:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Comprobar dependencias
        run: python -c "import tkinter, customtkinter, PIL, sounddevice, ctranslate2; print('deps OK')"
      - name: ffmpeg estático arm64
        run: |
          mkdir -p vendor
          curl -fsSL -o /tmp/ffmpeg.zip https://www.osxexperts.net/ffmpeg711arm.zip
          unzip -o -j /tmp/ffmpeg.zip ffmpeg -d vendor
          chmod +x vendor/ffmpeg
          file vendor/ffmpeg | grep -q arm64   # el de Homebrew no serviría: enlaza dinámico
      - name: Construir (PyInstaller)
        run: python -m PyInstaller --noconfirm --clean recordit.spec
      - name: Comprimir el .app
        # ditto y no zip: conserva los enlaces internos del bundle y la firma
        # ad-hoc que pone PyInstaller (obligatoria en arm64 para que arranque).
        run: ditto -c -k --keepParent dist/recordIt.app dist/recordIt-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: dist/recordIt-macos-arm64.zip
          if-no-files-found: error

  # --------------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-appimage, build-exe, build-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Crear Release de GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Intro fija con las instrucciones de descarga; debajo, gh añade las
          # notas nativas de GitHub (cambios desde el tag anterior) vía --generate-notes.
          cat > notes.md <<'EOF'
          **Descargas:**
          - `recordIt-x86_64.AppImage` — Linux x86-64 (portable): `chmod +x` y ejecutar.
          - `recordIt.exe` — Windows x86-64.
          EOF
          # El .app puede faltar: su job es continue-on-error. Si no está, la
          # Release sale sin él y sin prometerlo en las notas.
          adjuntos=("artifacts/appimage/recordIt-x86_64.AppImage"
                    "artifacts/exe/recordIt.exe")
          mac="artifacts/app/recordIt-macos-arm64.zip"
          if [ -f "$mac" ]; then
            cat >> notes.md <<'EOF'
          - `recordIt-macos-arm64.zip` — macOS 14+ (Apple Silicon): descomprime y, la
            primera vez, clic derecho sobre la app → Abrir (no está notarizada).
          EOF
            adjuntos+=("$mac")
          else
            echo "::warning::sin artefacto de macOS; la Release sale sin el .app"
          fi
          cat >> notes.md <<'EOF'

          La 1ª transcripción descarga el modelo Whisper large-v3 (~3 GB).
          EOF
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "recordIt ${{ github.ref_name }}" \
            --notes-file notes.md \
            --generate-notes \
            "${adjuntos[@]}"
